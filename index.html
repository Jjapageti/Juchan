<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교회 QR 보물찾기 | QR-Schatzsuche</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <main class="game-wrap">
    <section class="pixel-card" id="name-screen">
      <h1>🎮 교회 QR 보물찾기<span class="title-de">QR-Schatzsuche der Gemeinde</span></h1>
      <p class="sub-text">
        참가자 이름을 입력하고 미션을 시작하세요.<br />
        <span class="de-text">Gib deinen Namen ein und starte die Missionen.</span>
      </p>
      <input id="player-name" class="pixel-input" type="text" placeholder="이름 / Name" autocomplete="name" />
      <button id="start-btn" class="pixel-btn">시작하기 / Start</button>
    </section>

    <section class="pixel-card hidden" id="mission-screen">
      <div class="top-bar">
        <span id="player-label"></span>
        <button id="reset-btn" class="mini-btn">초기화 / Zurücksetzen</button>
      </div>

      <h2 id="mission-title"></h2>
      <div class="progress-box">
        <span id="progress-blocks">□□□□□□□□□□</span>
        <span id="progress-text">0 / 10</span>
      </div>

      <p id="mission-question" class="mission-text"></p>

      <div id="quiz-area">
        <input
          id="answer-input"
          class="pixel-input"
          type="password"
          placeholder="비밀번호 입력 / Passwort eingeben"
          autocomplete="off"
          autocapitalize="none"
        />
        <button id="check-answer-btn" class="pixel-btn">비밀번호 확인 / Passwort prüfen</button>
      </div>

      <p id="message" class="message" aria-live="polite"></p>
      <button id="next-btn" class="pixel-btn hidden">다음 랜덤 미션 / Nächste zufällige Mission</button>
    </section>

    <section class="pixel-card gold-card hidden" id="complete-screen">
      <h1>🎉 축하합니다!<span class="title-de">Herzlichen Glückwunsch!</span></h1>
      <p>10개의 미션을 모두 완료했습니다.<br /><span class="de-text">Alle 10 Missionen wurden abgeschlossen.</span></p>
      <p class="complete-name" id="complete-name"></p>
      <p class="complete-guide">
        진행자를 찾아가 완료 화면을 보여주세요.<br />
        <span class="de-text">Zeige diese Abschlussseite der Spielleitung.</span>
      </p>
      <button id="complete-reset-btn" class="pixel-btn">처음부터 다시하기 / Neu starten</button>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
