<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주찬양 보물찾기</title>
  <link rel="stylesheet" href="./css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
</head>
<body>
  <main class="game-wrap">
    <section class="pixel-card" id="name-screen">
      <h1>🎮 주찬양 보물찾기</h1>
      <p class="sub-text">참가자 이름을 입력하고 미션을 시작하세요.</p>
      <input id="player-name" class="pixel-input" type="text" placeholder="이름 또는 팀명" />
      <button id="start-btn" class="pixel-btn">시작하기</button>
    </section>

    <section class="pixel-card hidden" id="mission-screen">
      <div class="top-bar">
        <span id="player-label"></span>
        <button id="reset-btn" class="mini-btn">초기화</button>
      </div>
      <h2 id="mission-title"></h2>
      <div class="progress-box">
        <span id="progress-blocks">□□□□□</span>
        <span id="progress-text">0 / 5</span>
      </div>
      <p id="mission-question" class="mission-text"></p>
      <div id="quiz-area" class="hidden">
        <input id="answer-input" class="pixel-input" type="text" placeholder="정답 입력" />
        <button id="check-answer-btn" class="pixel-btn">정답 확인</button>
      </div>
      <div id="photo-area" class="hidden">
        <input id="photo-input" class="file-input" type="file" accept="image/*" capture="environment" />
        <img id="preview" class="preview hidden" alt="업로드한 사진 미리보기" />
        <button id="check-photo-btn" class="pixel-btn">사진 미션 확인</button>
        <p id="ai-result" class="ai-result"></p>
      </div>
      <p id="message" class="message"></p>
    </section>

    <section class="pixel-card hidden" id="nextqr-screen">
      <h1>✅ 미션 성공!</h1>
      <div class="progress-box">
        <span id="next-progress-blocks">□□□□□</span>
        <span id="next-progress-text">0 / 5</span>
      </div>
      <p class="mission-text">다음 QR 코드를 찾아<br />다시 스캔하세요.</p>
      <p class="sub-text small">이미 푼 문제는 다시 나오지 않습니다.</p>
    </section>

    <section class="pixel-card gold-card hidden" id="complete-screen">
      <h1>🎉 축하합니다!</h1>
      <p>5개의 미션을 모두 완료했습니다.</p>
      <p class="complete-name" id="complete-name"></p>
      <p class="complete-guide">진행자를 찾아가<br />완료 화면을 보여주고<br />번호표를 받아주세요.</p>
      <button id="complete-reset-btn" class="pixel-btn">처음부터 다시하기</button>
    </section>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
